name=TinyDNS
version=0.1.0
author=Phil Schatzmann <phil.schatzmann@gmail.com>
maintainer=Phil Schatzmann <phil.schatzmann@gmail.com>
sentence=Header-only DNS-over-TCP/TLS resolver and caching DNS server for Arduino.
paragraph=Resolves A/AAAA records over any Arduino Client (RFC 1035 TCP framing) and provides a DNS server that answers from an LRU cache and forwards misses upstream. Works with WiFiClient/EthernetClient (DNS-over-TCP:53) or WiFiClientSecure (DNS-over-TLS:853).
category=Communication
url=https://github.com/pschatzmann/TinyDNS
architectures=*
